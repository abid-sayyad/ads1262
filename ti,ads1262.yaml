%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/ti,ads1262.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments' ADS1262 32-Bit Analog to Digital Converter

maintainers:
  - Sayyad Abid <sayyad.abid16@gmail.com>

description: |
  Texas Instruments ADS1262 32-Bit Analog to Digital Converter with,
  internal temperature sensor, GPIOs and PGAs

  The ADS1262 is a 32-bit, 38-kSPS, precision ADC with a programmable gain
  amplifier (PGA) and internal voltage reference. It features:
  - 11 single-ended or 5 differential input channels
  - Internal temperature sensor
  - Programmable gain amplifier (PGA) with gains from 1 to 32
  - Internal voltage reference
  - GPIO pins for control and monitoring
  - SPI interface

  Specifications about the part can be found at:
  https://www.ti.com/product/ADS1262

properties:
  compatible:
    enum:
      - ti,ads1262
      - ti,ads1263

  reg:
    maxItems: 1
    description: SPI chip select number

  interrupts:
    maxItems: 1
    items:
      - description:
          Data-Ready pin is multiplexed while data out. While SPI CS is low,
          can be used to indicate the completion of a conversion.
  
  interrupt-names:
    maxItems: 1
    items:
      - const: drdy
  
  '#address-cells':
    const: 1

  '#size-cells':
    const: 0

  spi-max-frequency:
    maximum: 8000000
    description: Maximum SPI clock frequency in Hz (8 MHz)

  spi-cpha: true

  gpio-controller:
  description: Marks the device node as a GPIO controller.

  '#gpio-cells':
    const: 2
    description:
      The first cell is the GPIO number and the second cell specifies
      GPIO flags, as defined in <dt-bindings/gpio/gpio.h>.

  refin1p-supply:
    description: REFIN+ supply that can be used as reference for conversion.

  refin1n-supply:
    description: REFIN- supply that can be used as reference for conversion.

  refin2p-supply:
    description: REFIN2+ supply that can be used as reference for conversion.

  refin2n-supply:
    description: REFIN2- supply that can be used as reference for conversion.
  
  refin3p-supply:
    description: REFIN3+ supply that can be used as reference for conversion.

  refin3n-supply:
    description: REFIN3- supply that can be used as reference for conversion.

  clocks:
    maxItems: 1
    description:
      Optional external clock source. Can include one clock source; external
      clock or external crystal.

  clock-names:
    enum:
      - ext-clk
      - xtal

  '#clock-cells':
    const: 0

  drdy-gpios:
    maxItems: 1
    description:
      Using the DRDY pin is optional but recommended. This pin functions 
      as a GPIO interrupt that indicates when new data is available on MISO.
      While the same information can be obtained by polling the device 
      registers, doing so requires additional SPI transactions and results
      in extra DRDY interrupt events.
  
  reset-gpios:
    maxItems: 1
    description:
      This gpio is a manual reset signal to the ADC (ACTIVE_LOW). One can trigger
      this manual rest by setting this gpio to low.
    
  start-gpios:
    maxItems: 1
    description:
     This gpio is used for manually starting conversation on the ADC.
     This method bypasses serial communication between the two devices.
  
  aincom-supply:
    description:
      AINCOM voltage supply. Analog inputs AINx are referenced to this input
      when configured for pseudo-differential operation.
  
  avdd-supply:
    description:
      This is the positive input supply for the ADC's analog circuitry.
  
  avss-supply:
    description:
      This is the negative input supply for the ADC's analog circuitry.

  dvdd-supply:
    description:
      This is the positive input supply for the ADC's digital circuitry.

  '#io-channel-cells':
    const: 1

  ti,pga-bypass:
    type: boolean
    description:
      If true, bypass the PGA. If false or not specified, PGA is enabled.

  ti,data-rate:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [2.5, 16.6, 20, 50, 60, 100, 400, 1200, 2400, 4800, 7200, 14400, 19200, 38400]
    description:
      Data acquisition rate in samples per second

required:
  - compatible
  - reg
  - spi-cpha
  - '#address-cells'
  - '#size-cells'
  - '#io-channel-cells'

additionalProperties: false

patternProperties:
  "^channel@([0-9]|1[0-1])$":
    type: object
    additionalProperties: false
    description:
      Represents the external channels which are connected to the ADC.
      Channels 0-9 are available for external signals, channel 10 is AINCOM,
      and channel 11 is the internal temperature sensor.

    properties:
      reg:
        description:
          Channel number. It can have up to 10 channels numbered from 0 to 9,
          channel 10 is AINCOM, and channel 11 is the internal temperature sensor.
        items:
          - minimum: 0
            maximum: 11

      diff-channels:
        description:
          List of two channel numbers for differential measurement.
          First number is positive input, second is negative input.
          Not applicable for temperature sensor (channel 11).
        items:
          - minimum: 0
            maximum: 9
          - minimum: 0
            maximum: 9

      ti,gain:
        $ref: /schemas/types.yaml#/definitions/uint32
        enum : [1, 2, 4, 8, 16, 32]
        default: 1
        description:
          PGA gain setting. Not applicable for temperature sensor (channel 11).

    required:
      - reg

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    spi {
      #address-cells = <1>;
      #size-cells = <0>;

      adc@0 {
        compatible = "ti,ads1262";
        reg = <0>;
        spi-max-frequency = <7372800>;
        vref-supply = <&adc_vref>;
        spi-cpha;
        reset-gpios = <&gpio1 16 GPIO_ACTIVE_LOW>;
        ti,pga-bypass;
        ti,data-rate = <15>; /* 38400 SPS */

        #address-cells = <1>;
        #size-cells = <0>;
        #io-channel-cells = <1>;

        /* Single-ended channel */
        channel@0 {
          reg = <0>;
        };

        /* Differential channel */
        channel@1 {
          reg = <1>;
          diff-channels = <1 2>;
          ti,gain = <2>; /* Gain of 4 */
        };

        /* Temperature sensor */
        channel@11 {
          reg = <11>;
        };
      };
    };
...
